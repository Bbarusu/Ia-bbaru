<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"
    />
    <title>Ia-bbaru</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <header>
      <div class="tabbar">
        <div id="tabs" role="tablist" aria-label="Abas abertas"></div>
        <button id="new" type="button" title="Nova aba" aria-label="Nova aba">
          ＋
        </button>
        <div class="window-actions" role="group" aria-label="Controle da janela">
          <button
            id="minimize"
            type="button"
            class="win-circle"
            title="Minimizar painel"
            aria-label="Minimizar painel"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                d="M5 12h14"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            id="power"
            type="button"
            class="win-circle power"
            title="Encerrar o Ia-bbaru"
            aria-label="Encerrar o Ia-bbaru"
          >
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path
                d="M12 3v8M6.5 6.5a8 8 0 1 0 11 0"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar">
        <button id="back" type="button" aria-label="Voltar" title="Voltar">
          ←
        </button>
        <button
          id="forward"
          type="button"
          aria-label="Avançar"
          title="Avançar"
        >
          →
        </button>
        <button
          id="reload"
          type="button"
          aria-label="Recarregar"
          title="Recarregar"
        >
          ↻
        </button>
        <form id="navigation">
          <span class="address-icon" aria-hidden="true">⌕</span>
          <input
            id="address"
            aria-label="Endereço ou pesquisa"
            placeholder="Pesquise ou digite um endereço"
            autocomplete="off"
            spellcheck="false"
          />
        </form>
        <button
          id="bookmark-toggle"
          type="button"
          class="sub-action"
          title="Salvar página atual nos favoritos"
          aria-label="Favoritar página"
        >
          ★
        </button>
        <button
          id="capture"
          type="button"
          class="capture"
          title="Adicionar o texto selecionado ao projeto"
        >
          ＋ Capturar
        </button>
        <button
          id="panel"
          type="button"
          class="primary"
          aria-pressed="true"
        >
          ◈ Agentes
        </button>
        <button
          id="expand"
          type="button"
          aria-label="Ampliar espaço de trabalho"
          title="Ampliar espaço de trabalho"
          aria-pressed="false"
        >
          ⤢
        </button>
      </div>

      <div class="subbar">
        <div
          id="subtabs"
          class="subtabs"
          role="group"
          aria-label="Sub-abas da aba ativa"
        ></div>
        <span class="subbar-divider" aria-hidden="true"></span>
        <div
          id="bookmarks"
          class="bookmarks"
          role="group"
          aria-label="Barra de favoritos"
        ></div>
        <div id="message" role="status" aria-live="polite"></div>
      </div>
    </header>
    <script src="shell.js"></script>
  </body>
</html>
