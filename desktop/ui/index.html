<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"
    />
    <title>Yuki</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ffffff'/%3E%3Cg fill='none' stroke='%2307090d' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2v20M19.07 4.93 4.93 19.07M22 12H2M19.07 19.07 4.93 4.93'/%3E%3Cpath d='m10 4 2 2 2-2M14 20l-2-2-2 2M4 10l2 2-2 2M20 14l-2-2 2-2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <header>
      <div class="tabbar">
        <div class="brand" aria-hidden="true">
          <span class="yuki-icon">
            <svg
              viewBox="0 0 24 24"
              width="13"
              height="13"
              fill="none"
              stroke="#07090d"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 2v20M19.07 4.93 4.93 19.07M22 12H2M19.07 19.07 4.93 4.93" />
              <path d="m10 4 2 2 2-2M14 20l-2-2-2 2M4 10l2 2-2 2M20 14l-2-2 2-2" />
            </svg>
          </span>
          <span class="brand-name">Yuki</span>
        </div>
        <div id="tabs" role="group" aria-label="Abas abertas"></div>
        <button id="new" type="button" title="Nova aba" aria-label="Nova aba">
          ＋
        </button>
        <div class="window-actions" role="group" aria-label="Controle da janela">
          <button
            id="minimize"
            type="button"
            class="win-circle"
            title="Minimizar painel"
            aria-label="Minimizar painel"
          >
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
              <path
                d="M6 12h12"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            id="power"
            type="button"
            class="win-circle power"
            title="Encerrar o Yuki"
            aria-label="Encerrar o Yuki"
          >
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
              <path
                d="M12 3.5v7.5M6.8 6.8a7.5 7.5 0 1 0 10.4 0"
                fill="none"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar">
        <button id="back" type="button" aria-label="Voltar" title="Voltar">
          ←
        </button>
        <button
          id="forward"
          type="button"
          aria-label="Avançar"
          title="Avançar"
        >
          →
        </button>
        <button
          id="reload"
          type="button"
          aria-label="Recarregar"
          title="Recarregar"
        >
          ↻
        </button>
        <form id="navigation">
          <span class="address-icon" aria-hidden="true">⌕</span>
          <input
            id="address"
            aria-label="Endereço ou pesquisa"
            placeholder="Pesquise ou digite um endereço no Yuki"
            autocomplete="off"
            spellcheck="false"
          />
        </form>
        <button
          id="bookmark-toggle"
          type="button"
          class="sub-action"
          title="Salvar página atual nos favoritos"
          aria-label="Favoritar página"
        >
          ★
        </button>
        <button
          id="capture"
          type="button"
          class="capture"
          title="Adicionar o texto selecionado ao projeto"
        >
          ＋ Capturar
        </button>
        <button
          id="panel"
          type="button"
          class="primary"
          aria-pressed="true"
        >
          ❄ Agentes
        </button>
        <button
          id="expand"
          type="button"
          aria-label="Ampliar espaço de trabalho"
          title="Ampliar espaço de trabalho"
          aria-pressed="false"
        >
          ⤢
        </button>
      </div>

      <div class="subbar">
        <div
          id="subtabs"
          class="subtabs"
          role="group"
          aria-label="Sub-abas da aba ativa"
        ></div>
        <span class="subbar-divider" aria-hidden="true"></span>
        <div
          id="bookmarks"
          class="bookmarks"
          role="group"
          aria-label="Barra de favoritos"
        ></div>
        <div id="message" role="status" aria-live="polite"></div>
      </div>
    </header>
    <script src="shell.js"></script>
  </body>
</html>
