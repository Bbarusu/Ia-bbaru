<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"
    />
    <title>Ia-bbaru</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <header>
      <div class="tabbar">
        <span class="brand" aria-hidden="true">
          <span class="mark" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
        </span>
        <div id="tabs" role="tablist" aria-label="Abas abertas"></div>
        <button id="new" type="button" title="Nova aba" aria-label="Nova aba">
          ＋
        </button>
        <span class="edition">IA-BBARU <small>CHROMIUM</small></span>
      </div>
      <div class="toolbar">
        <button id="back" type="button" aria-label="Voltar" title="Voltar">
          ←
        </button>
        <button
          id="forward"
          type="button"
          aria-label="Avançar"
          title="Avançar"
        >
          →
        </button>
        <button
          id="reload"
          type="button"
          aria-label="Recarregar"
          title="Recarregar"
        >
          ↻
        </button>
        <form id="navigation">
          <span class="address-icon" aria-hidden="true">⌕</span>
          <input
            id="address"
            aria-label="Endereço ou pesquisa"
            placeholder="Pesquise ou digite um endereço"
            autocomplete="off"
            spellcheck="false"
          />
        </form>
        <button
          id="capture"
          type="button"
          class="capture"
          title="Adicionar o texto selecionado ao projeto"
        >
          ＋ Capturar
        </button>
        <button
          id="panel"
          type="button"
          class="primary"
          aria-pressed="true"
        >
          ◈ Agentes
        </button>
        <button
          id="expand"
          type="button"
          aria-label="Ampliar espaço de trabalho"
          title="Ampliar espaço de trabalho"
          aria-pressed="false"
        >
          ⤢
        </button>
      </div>
      <div id="message" role="status" aria-live="polite"></div>
    </header>
    <script src="shell.js"></script>
  </body>
</html>
