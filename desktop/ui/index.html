<!doctype html>
<html lang="pt-BR">
  <head>

    <meta name="viewport" content="width=device-width,initial-scale=1" />

    />
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <header>
      <div class="tabbar">
        <div class="brand" aria-hidden="true">
          <span class="yuki-icon">
            <svg
              viewBox="0 0 24 24"
              width="13"
              height="13"
              fill="none"
              stroke="#07090d"
              stroke-width="1.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12.00 9.80L12.00 2.80M12.00 7.10L9.75 5.80M12.00 7.10L14.25 5.80M12.00 4.70L10.53 3.85M12.00 4.70L13.47 3.85M13.91 10.90L19.97 7.40M16.24 9.55L16.24 6.95M16.24 9.55L18.50 10.85M18.32 8.35L18.32 6.65M18.32 8.35L19.79 9.20M13.91 13.10L19.97 16.60M16.24 14.45L18.50 13.15M16.24 14.45L16.24 17.05M18.32 15.65L19.79 14.80M18.32 15.65L18.32 17.35M12.00 14.20L12.00 21.20M12.00 16.90L14.25 18.20M12.00 16.90L9.75 18.20M12.00 19.30L13.47 20.15M12.00 19.30L10.53 20.15M10.09 13.10L4.03 16.60M7.76 14.45L7.76 17.05M7.76 14.45L5.50 13.15M5.68 15.65L5.68 17.35M5.68 15.65L4.21 14.80M10.09 10.90L4.03 7.40M7.76 9.55L5.50 10.85M7.76 9.55L7.76 6.95M5.68 8.35L4.21 9.20M5.68 8.35L5.68 6.65" />
              <path d="M12.00 9.80L13.91 10.90L13.91 13.10L12.00 14.20L10.09 13.10L10.09 10.90Z" />
            </svg>
          </span>
          <span class="brand-name">Yuki</span>
        </div>
        <div id="tabs" role="group" aria-label="Abas abertas"></div>
        <button id="new" type="button" title="Nova aba (Ctrl+T)" aria-label="Nova aba">
          ＋
        </button>
        <!-- Bolinhas no estilo do Safari, à direita. Ações marcadas com data-codex
             dependem do runtime (docs/PEDIDO_VISAO_E_NAVEGADOR.md, W1). -->
        <div class="window-actions" role="group" aria-label="Controle da janela">
          <button id="power" type="button" class="win-dot close" title="Fechar o Yuki" aria-label="Fechar o Yuki"></button>
          <button id="minimize" type="button" class="win-dot min" title="Minimizar janela" aria-label="Minimizar janela"></button>
          <button id="maximize" type="button" class="win-dot max" data-codex="window.maximize" title="Ampliar janela" aria-label="Ampliar janela"></button>
        </div>
      </div>

      <div class="toolbar">
        <button id="back" type="button" aria-label="Voltar" title="Voltar (Alt+←)">
          ←
        </button>
        <button
          id="forward"
          type="button"
          aria-label="Avançar"
          title="Avançar (Alt+→)"
        >
          →
        </button>
        <button
          id="reload"
          type="button"
          aria-label="Recarregar"
          title="Recarregar (Ctrl+R)"
        >
          ↻
        </button>

        <form id="navigation">
          <button
            id="site-security"
            type="button"
            class="omnibox-badge"
            title="Segurança da conexão e isolamento da aba"
            aria-label="Segurança da página"
          >
            ❄
          </button>
          <input
            id="address"
            aria-label="Endereço ou pesquisa"
            placeholder="Pesquise ou digite um endereço no Yuki"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            id="bookmark-toggle"
            type="button"
            class="omnibox-action"
            title="Salvar página atual nos favoritos"
            aria-label="Favoritar página"
          >
            ★
          </button>
        </form>



        <button
          id="more"
          type="button"
          class="sub-action"
          title="Mais ações: capturas, busca, zoom e histórico"
          aria-label="Mais ações"
          aria-controls="shell-actions"
          aria-expanded="false"
        >
          ⋯
        </button>
        <button
          id="panel"
          type="button"
          class="primary"
          aria-pressed="true"
          aria-keyshortcuts="Control+Shift+L"
          title="Abrir ou fechar a conversa com o Claude ao lado da página (Ctrl+Shift+L)"
        >
          ❄ Perguntar ao Claude
        </button>
        <button
          id="expand"
          type="button"
          aria-label="Ampliar espaço de trabalho"
          title="Ampliar espaço de trabalho"
          aria-pressed="false"
        >
          ⤢
        </button>
      </div>

      <div class="subbar">
        <div id="subbar-default" class="subbar-default">
          <div
            id="bookmarks"
            class="bookmarks"
            role="group"
            aria-label="Barra de favoritos"
          ></div>
          <div id="shell-actions" class="shell-actions" role="group" aria-label="Mais ações do navegador" hidden>
            <button id="capture" type="button" class="shell-action" title="Enviar o texto selecionado ao chat (pede confirmação)">Capturar trecho</button>
            <button id="capture-print" type="button" class="shell-action" title="Salvar um print da aba na biblioteca">Capturar print</button>
            <button id="capture-image" type="button" class="shell-action" title="Salvar uma imagem da página na biblioteca">Capturar imagem</button>
            <button id="find-toggle" type="button" class="shell-action" title="Buscar nesta página (Ctrl+F)">Buscar na página</button>
            <button id="zoom-toggle" type="button" class="shell-action" aria-label="Zoom da página" title="Ajustar zoom da página">100%</button>
            <button id="width-toggle" type="button" class="shell-action" aria-label="Largura do painel" title="Ajustar a largura do painel do Claude">Largura</button>
            <button id="downloads-open" type="button" class="shell-action" title="Downloads no painel">Downloads</button>
            <button id="settings-open" type="button" class="shell-action" title="Ajustes do navegador no painel">Ajustes</button>
            <button id="history-toggle" type="button" class="shell-action" title="Histórico de navegação">Histórico</button>
            <button id="home" type="button" class="shell-action" aria-label="Página inicial" title="Ir para a página inicial do Yuki">Início</button>
            <button id="reopen-tab" type="button" class="shell-action" title="Reabrir última aba fechada (Ctrl+Shift+T)">Reabrir aba</button>
          </div>
        </div>

        <div id="subbar-tool" class="subbar-tool" hidden></div>

        <div id="message" role="status" aria-live="polite"></div>
      </div>
    </header>
    <script src="shell.js"></script>
  </body>
</html>
