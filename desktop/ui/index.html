<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'"
    />
    <title>Yuki</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ffffff'/%3E%3Cg fill='none' stroke='%2307090d' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2v20M19.07 4.93 4.93 19.07M22 12H2M19.07 19.07 4.93 4.93'/%3E%3Cpath d='m10 4 2 2 2-2M14 20l-2-2-2 2M4 10l2 2-2 2M20 14l-2-2 2-2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <header>
      <div class="tabbar">
        <div class="brand" aria-hidden="true">
          <span class="yuki-icon">
            <svg
              viewBox="0 0 24 24"
              width="13"
              height="13"
              fill="none"
              stroke="#07090d"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 2v20M19.07 4.93 4.93 19.07M22 12H2M19.07 19.07 4.93 4.93" />
              <path d="m10 4 2 2 2-2M14 20l-2-2-2 2M4 10l2 2-2 2M20 14l-2-2 2-2" />
            </svg>
          </span>
          <span class="brand-name">Yuki</span>
        </div>
        <div id="tabs" role="group" aria-label="Abas abertas"></div>
        <button id="new" type="button" title="Nova aba (Ctrl+T)" aria-label="Nova aba">
          ＋
        </button>
        <button
          id="reopen-tab"
          type="button"
          class="win-circle"
          title="Reabrir última aba fechada (Ctrl+Shift+T)"
          aria-label="Reabrir aba fechada"
        >
          ↺
        </button>
        <div class="window-actions" role="group" aria-label="Controle da janela">
          <button
            id="minimize"
            type="button"
            class="win-circle"
            title="Minimizar janela"
            aria-label="Minimizar janela"
          >
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
              <path
                d="M6 12h12"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            id="power"
            type="button"
            class="win-circle power"
            title="Encerrar o Yuki"
            aria-label="Encerrar o Yuki"
          >
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
              <path
                d="M12 3.5v7.5M6.8 6.8a7.5 7.5 0 1 0 10.4 0"
                fill="none"
                stroke="currentColor"
                stroke-width="1.65"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="toolbar">
        <button id="back" type="button" aria-label="Voltar" title="Voltar (Alt+←)">
          ←
        </button>
        <button
          id="forward"
          type="button"
          aria-label="Avançar"
          title="Avançar (Alt+→)"
        >
          →
        </button>
        <button
          id="reload"
          type="button"
          aria-label="Recarregar"
          title="Recarregar (Ctrl+R)"
        >
          ↻
        </button>
        <button
          id="home"
          type="button"
          aria-label="Página inicial"
          title="Ir para a página inicial do Yuki"
        >
          ⌂
        </button>

        <form id="navigation">
          <button
            id="site-security"
            type="button"
            class="omnibox-badge"
            title="Segurança da conexão e isolamento da aba"
            aria-label="Segurança da página"
          >
            ❄
          </button>
          <input
            id="address"
            aria-label="Endereço ou pesquisa"
            placeholder="Pesquise ou digite um endereço no Yuki"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            id="find-toggle"
            type="button"
            class="omnibox-action"
            title="Buscar nesta página (Ctrl+F)"
            aria-label="Buscar na página"
          >
            ⌕
          </button>
          <button
            id="zoom-toggle"
            type="button"
            class="omnibox-action zoom-indicator"
            title="Ajustar zoom da página"
            aria-label="Zoom da página"
          >
            100%
          </button>
          <button
            id="bookmark-toggle"
            type="button"
            class="omnibox-action"
            title="Salvar página atual nos favoritos"
            aria-label="Favoritar página"
          >
            ★
          </button>
        </form>

        <div class="capture-group" role="group" aria-label="Capturar contexto da página">
          <button
            id="capture"
            type="button"
            class="capture"
            title="Capturar texto selecionado na página"
          >
            ＋ Capturar
          </button>
          <button
            id="capture-print"
            type="button"
            class="capture-mode-btn"
            title="Capturar print da tela/aba para o projeto"
            aria-label="Capturar print"
          >
            📸 Print
          </button>
          <button
            id="capture-image"
            type="button"
            class="capture-mode-btn"
            title="Capturar imagem da página para o projeto"
            aria-label="Capturar imagem"
          >
            🖼 Imagem
          </button>
        </div>

        <button
          id="history-toggle"
          type="button"
          class="sub-action"
          title="Histórico de navegação"
          aria-label="Histórico de navegação"
        >
          🕘
        </button>

        <button
          id="panel"
          type="button"
          class="primary"
          aria-pressed="true"
          title="Abrir barra lateral de agentes do Yuki"
        >
          ❄ Perguntar ao Yuki
        </button>
        <button
          id="expand"
          type="button"
          aria-label="Ampliar espaço de trabalho"
          title="Ampliar espaço de trabalho"
          aria-pressed="false"
        >
          ⤢
        </button>
      </div>

      <div class="subbar">
        <div id="subbar-default" class="subbar-default">
          <div
            id="bookmarks"
            class="bookmarks"
            role="group"
            aria-label="Barra de favoritos"
          ></div>
          <span class="subbar-divider" aria-hidden="true"></span>
          <div
            id="context-actions"
            class="context-actions"
            role="group"
            aria-label="Ações rápidas com agentes do Yuki"
          >
            <button
              type="button"
              class="context-chip"
              data-context="summarize"
              title="Capturar texto da página para consulta no painel"
            >
              ✨ Resumir página
            </button>
            <button
              type="button"
              class="context-chip"
              data-context="print"
              title="Capturar print visível da aba web"
            >
              📸 Analisar print
            </button>
            <button
              type="button"
              class="context-chip"
              data-context="image"
              title="Importar imagem local para o projeto"
            >
              🖼 Extrair imagem
            </button>
          </div>
        </div>

        <div id="subbar-tool" class="subbar-tool" hidden></div>

        <div id="message" role="status" aria-live="polite"></div>
      </div>
    </header>
    <script src="shell.js"></script>
  </body>
</html>
